name: Apply mobile uploader fix

on:
  push:
    branches:
      - fix/uploader-mobile-selection-v10

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-uploader-fix.yml
          git commit -m "chore: remove temporary uploader patch workflow"
          git push
